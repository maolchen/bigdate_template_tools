# ============================================================
# Kafka 配置文件
# 主机: worker03 (192.168.10.15)
# 节点: node6 (索引: 2, broker_id: 3)
# ============================================================

# Broker ID（自动推导）
broker.id=3

# 监听地址
listeners=PLAINTEXT://192.168.10.15:9092
advertised.listeners=PLAINTEXT://192.168.10.15:9092

# 日志目录
log.dirs=/data/localization/kafka/logs

# ============================================================
# Zookeeper 配置（自动生成连接串）
# ============================================================
zookeeper.connect=192.168.10.10:2181,192.168.10.11:2181,192.168.10.12:2181
zookeeper.connection.timeout.ms=6000

# ============================================================
# 日志配置
# ============================================================
num.partitions=3
default.replication.factor=2
log.retention.hours=168
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# ============================================================
# 性能配置
# ============================================================
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ============================================================
# 其他配置
# ============================================================
auto.create.topics.enable=true
delete.topic.enable=true
