# ============================================================
# Kafka 配置文件
# 主机: node6 (192.168.10.15)
# ============================================================

# Broker ID
broker.id=3

# 监听地址
listeners=PLAINTEXT://192.168.10.15:9092
advertised.listeners=PLAINTEXT://192.168.10.15:9092

# 日志目录（使用全局变量）
log.dirs=/data/localization/kafka/logs

# ============================================================
# Zookeeper 配置
# ============================================================
# ZK连接串（自动从全局配置生成）
zookeeper.connect=192.168.10.10:2181,192.168.10.11:2181,192.168.10.12:2181
zookeeper.connection.timeout.ms=6000

# ============================================================
# 日志配置
# ============================================================
num.partitions=3
default.replication.factor=2
log.retention.hours=168

# 日志文件大小
log.segment.bytes=1073741824
log.retention.check.interval.ms=300000

# ============================================================
# 性能配置
# ============================================================
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# ============================================================
# 其他配置
# ============================================================
auto.create.topics.enable=true
delete.topic.enable=true
