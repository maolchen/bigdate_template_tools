# ============================================================
# Kafka Server 配置文件
# 节点: realtime-kafka2
# IP: 192.168.10.14
# broker.id: 2
# ============================================================

# Broker ID（自动推导）
broker.id=2

# 监听地址
listeners=PLAINTEXT://192.168.10.14:9092
advertised.listeners=PLAINTEXT://192.168.10.14:9092

# 日志目录
log.dirs=/data/bigdata/kafka/logs

# Zookeeper连接
# 注意：zk_connect 为衍生变量，在运行时根据 zookeeper 服务拓扑自动计算
zookeeper.connect=192.168.10.10:2181,192.168.10.11:2181,192.168.10.12:2181

# 分区数量
num.partitions=3

# 默认副本因子
default.replication.factor=2

# 日志保留时间（小时）
log.retention.hours=168

# 日志段大小
log.segment.bytes=1073741824

# 日志清理策略
log.cleanup.policy=delete

# 线程配置
num.network.threads=3
num.io.threads=8
socket.send.buffer.bytes=102400
socket.receive.buffer.bytes=102400
socket.request.max.bytes=104857600

# 组协调器配置
group.initial.rebalance.delay.ms=0
