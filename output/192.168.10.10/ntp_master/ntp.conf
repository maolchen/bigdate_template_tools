# /etc/ntp.conf - NTP Master Server Configuration
# Generated by offline-config-generator
# Node: dw-master1 (192.168.10.10)

# Drift file
driftfile  /var/lib/ntp/drift
pidfile    /var/run/ntpd.pid
logfile    /var/log/ntp.log

# Local clock - use as fallback time source
server 127.127.1.0
fudge  127.127.1.0 stratum 10

# Default restrictions
restrict default nomodify notrap nopeer noquery
restrict 127.0.0.1
restrict ::1

# White list - allow slave nodes to sync
restrict 192.168.10.11 nomodify notrap
restrict 192.168.10.12 nomodify notrap
restrict 192.168.10.13 nomodify notrap
restrict 192.168.10.14 nomodify notrap
restrict 192.168.10.15 nomodify notrap
restrict 192.168.10.13 nomodify notrap
restrict 192.168.10.14 nomodify notrap
restrict 192.168.10.15 nomodify notrap
restrict 192.168.10.16 nomodify notrap
restrict 192.168.10.17 nomodify notrap
restrict 192.168.10.18 nomodify notrap

# Allow localhost
restrict 127.127.1.0

# Enable statistics
statsdir /var/log/ntpstats/
statistics loopstats peerstats clockstats
filegen loopstats file loopstats type day enable
filegen peerstats file peerstats type day enable
filegen clockstats file clockstats type day enable
