# ============================================================
# Zookeeper 配置文件
# 主机: node3 (192.168.10.12)
# ============================================================

# 心跳时间（毫秒）
tickTime=2000

# 初始化同步阶段能容忍的心跳数
initLimit=10

# 请求响应阶段能容忍的心跳数
syncLimit=5

# 数据目录（使用全局变量data_base_dir）
dataDir=/data/bigdata/zookeeper/data

# 客户端端口
clientPort=2181

# 最大客户端连接数
# maxClientCnxns=60

# 自动清理配置
# autopurge.snapRetainCount=3
# autopurge.purgeInterval=1

# ============================================================
# 服务器列表（自动从全局配置生成）
# 格式：server.<myid>=<ip>:<server_port>:<election_port>
# ============================================================
server.1=192.168.10.10:2888:3888
server.2=192.168.10.11:2888:3888
server.3=192.168.10.12:2888:3888
