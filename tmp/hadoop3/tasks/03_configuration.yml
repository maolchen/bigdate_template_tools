---
- name: Upload all hadoop config files
  template:
    src: "{{ item.tpl }}"
    dest: "{{ config_dir }}/{{ item.cfg }}"
  with_items:
  - { tpl: "capacity-scheduler.xml.tpl", cfg: "capacity-scheduler.xml" }
  - { tpl: "core-site.xml.tpl", cfg: "core-site.xml" }
  - { tpl: "hdfs-site.xml.tpl", cfg: "hdfs-site.xml" }
  - { tpl: "mapred-site.xml.tpl", cfg: "mapred-site.xml" }
  - { tpl: "slaves.tpl", cfg: "slaves" }
  - { tpl: "workers.tpl", cfg: "workers" }
  - { tpl: "yarn-site.xml.tpl", cfg: "yarn-site.xml" }

- name: Set Hadoop environment variables
  ansible.builtin.lineinfile:
    path: "{{ install_dir }}/etc/hadoop/hadoop-env.sh"
    line: |
      export JAVA_HOME={{ GLOBAL.environments.JAVA_HOME }}
      export HADOOP_HOME={{ install_dir }}
      export HDFS_NAMENODE_USER={{ GLOBAL.run_user }}
      export HDFS_DATANODE_USER={{ GLOBAL.run_user }}
      export HDFS_SECONDARYNAMENODE_USER={{ GLOBAL.run_user }}
      export YARN_RESOURCEMANAGER_USER={{ GLOBAL.run_user }}
      export YARN_NODEMANAGER_USER={{ GLOBAL.run_user }}
      export HDFS_JOURNALNODE_USER="{{ GLOBAL.run_user }}"
      export HDFS_ZKFC_USER="{{ GLOBAL.run_user }}"
    insertafter: EOF
    mode: '0644'
