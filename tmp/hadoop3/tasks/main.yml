---

# 系统架构判断
- name: Fail if not aarch64 (when using --tags hadoop3_arm)
  fail:
    msg: "此任务仅适用于ARM架构，检测到{{ ansible_architecture }}。请改用 --tags hadoop3_arm"
  when: "'hadoop3_arm' in ansible_run_tags and ansible_architecture != 'aarch64'"
  # 系统配置
  #- name: Include system configuration tasks
  #  ansible.builtin.import_tasks: 01_system_config.yml
  # 安装过程
- name: Include Hadoop installation tasks
  ansible.builtin.import_tasks: 02_install_hadoop.yml
  # 配置文件部署
- name: Include configuration tasks
  ansible.builtin.import_tasks: 03_configuration.yml
  # 目录结构设置
- name: Include directory setup tasks
  ansible.builtin.import_tasks: 04_dir_setup.yml
  # 服务启动
- name: Include service startup tasks
  ansible.builtin.import_tasks: 05_service_startup.yml
  # 验证步骤
- name: Include verification tasks
  ansible.builtin.import_tasks: 06_verification.yml
