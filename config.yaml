# ============================================================
# 大数据平台配置清单 - 极简版
# ============================================================
# 特点：
# 1. 节点池集中定义 - IP修改只需改一处
# 2. 服务拓扑简洁 - 用节点索引描述部署位置
# 3. ID自动推导 - myid/broker_id自动计算
# ============================================================

# ============================================================
# 全局配置（几乎不需要修改）
# ============================================================
global:
  # 基础目录
  install_base_dir: "/data/localization"
  data_base_dir: "/data/bigdata"
  log_base_dir: "/var/log/bigdata"
  temp_dir: "/data/tmp_install_dir"
  software_dir: "/data/softwares"
  
  # JDK配置
  jdk_version: "1.8.0_65"
  jdk_path: "/data/jdk"
  java_home: "/data/jdk/jdk1.8.0_65"
  
  # 系统用户
  user: "bigdata"
  group: "bigdata"
  timezone: "Asia/Shanghai"

# ============================================================
# 节点池定义（IP和hostname集中管理，修改只需改这里）
# ============================================================
# 格式：节点别名: {ip, hostname}
# 节点索引用于服务拓扑，从0开始
nodes:
  node1:
    ip: "192.168.10.10"
    hostname: "master01"
  
  node2:
    ip: "192.168.10.11"
    hostname: "master02"
  
  node3:
    ip: "192.168.10.12"
    hostname: "master03"
  
  node4:
    ip: "192.168.10.13"
    hostname: "worker01"
  
  node5:
    ip: "192.168.10.14"
    hostname: "worker02"
  
  node6:
    ip: "192.168.10.15"
    hostname: "worker03"
  
  node7:
    ip: "192.168.10.16"
    hostname: "es01"
  
  node8:
    ip: "192.168.10.17"
    hostname: "es02"
  
  node9:
    ip: "192.168.10.18"
    hostname: "es03"

# ============================================================
# 服务拓扑定义（描述服务部署在哪些节点）
# ============================================================
# nodes字段：使用节点别名列表
# id_auto_derive字段：是否自动推导ID（myid/broker_id等）
# ID自动推导规则：节点在该服务部署列表中的索引 + 1
# ============================================================

services:
  # ==================== 基础服务 ====================
  
  zookeeper:
    nodes: [node1, node2, node3]
    id_auto_derive: true  # 自动推导myid: node1=1, node2=2, node3=3
    vars:
      version: "3.8.3"
      client_port: 2181
      server_port: 2888
      election_port: 3888
      tick_time: 2000
      init_limit: 10
      sync_limit: 5

  kafka:
    nodes: [node4, node5, node6]
    id_auto_derive: true  # 自动推导broker_id: node4=1, node5=2, node6=3
    vars:
      version: "3.5.1"
      scala_version: "2.13"
      broker_port: 9092
      num_partitions: 3
      default_replication_factor: 2
      log_retention_hours: 168

  # ==================== Hadoop生态 ====================
  
  hadoop_namenode:
    nodes: [node1, node2]
    id_auto_derive: true  # 自动推导namenode_id: node1=nn1, node2=nn2
    vars:
      version: "3.3.6"
      namenode_port: 9820
      http_port: 9870

  hadoop_datanode:
    nodes: [node3, node4, node5, node6]
    vars:
      version: "3.3.6"
      data_port: 9866
      http_port: 9864

  spark_master:
    nodes: [node1]
    vars:
      version: "3.5.0"
      hadoop_version: "3"
      master_port: 7077
      webui_port: 8080

  spark_worker:
    nodes: [node3, node4, node5, node6]
    vars:
      version: "3.5.0"
      webui_port: 8081
      cores: 4
      memory: "4g"

  flink_jobmanager:
    nodes: [node1]
    vars:
      version: "1.18.0"
      scala_version: "2.12"
      rpc_port: 6123
      web_port: 8081

  flink_taskmanager:
    nodes: [node3, node4, node5, node6]
    vars:
      version: "1.18.0"
      task_slots: 4
      memory: "2g"

  # ==================== 数据存储 ====================
  
  elasticsearch:
    nodes: [node7, node8, node9]
    vars:
      version: "8.11.1"
      cluster_name: "bigdata-cluster"
      http_port: 9200
      transport_port: 9300

  # ==================== 调度系统 ====================
  
  dolphinscheduler_master:
    nodes: [node1]
    vars:
      version: "3.1.9"
      master_port: 5678

  dolphinscheduler_worker:
    nodes: [node3, node4, node5, node6]
    vars:
      version: "3.1.9"
      worker_port: 1234

  dolphinscheduler_api:
    nodes: [node1]
    vars:
      version: "3.1.9"
      api_port: 12345

  # ==================== 扩展示例 ====================
  
  # Doris FE
  # doris_fe:
  #   nodes: [node1, node2]
  #   id_auto_derive: true  # 自动推导fe_id
  #   vars:
  #     version: "2.0.3"
  #     http_port: 8030
  #     query_port: 9030

  # Doris BE
  # doris_be:
  #   nodes: [node3, node4, node5]
  #   vars:
  #     version: "2.0.3"
  #     be_port: 9060

  # Nginx
  # nginx:
  #   nodes: [node1]
  #   vars:
  #     version: "1.24.0"
  #     http_port: 80

  # 业务应用
  # myapp:
  #   nodes: [node2, node3]
  #   id_auto_derive: true  # 自动推导instance_id
  #   vars:
  #     version: "1.0.0"
  #     port: 8080

# ============================================================
# 节点特化配置（可选，用于覆盖默认值）
# ============================================================
# 只有当某个节点需要特殊配置时才定义
# ============================================================
node_overrides:
  # 例如：node4内存更大，可以提高Spark Worker配置
  # node4:
  #   spark_worker:
  #     memory: "8g"
  #     cores: 8
  
  # 例如：node9仅作为ES数据节点
  # node9:
  #   elasticsearch:
  #     node_master: false
  #     node_data: true
