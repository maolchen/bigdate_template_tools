# ============================================================
# 大数据平台配置清单 - v4 拓扑配置分离版
# ============================================================
# 结构说明：
# - global:      全局参数（基础目录、JDK、用户等）
# - nodes:       IP和hostname映射（允许节点复用）
# - serviceTop:  服务部署拓扑（修改部署位置只需看这里）
# - serverConfig: 服务配置参数（一般不需要修改）
# ============================================================

# ============================================================
# 全局配置（几乎不需要修改）
# ============================================================
global:
  # 基础目录
  install_base_dir: "/data/localization"
  data_base_dir: "/data/bigdata"
  log_base_dir: "/var/log/bigdata"
  temp_dir: "/data/tmp_install_dir"
  software_dir: "/data/softwares"
  
  # JDK配置
  jdk_version: "1.8.0_65"
  jdk_path: "/data/jdk"
  java_home: "/data/jdk/jdk1.8.0_65"
  
  # 系统用户
  user: "bigdata"
  group: "bigdata"
  timezone: "Asia/Shanghai"

# ============================================================
# 节点池（IP和hostname映射，允许节点复用）
# ============================================================
# 说明：一个物理IP可以对应多个节点别名（节点复用场景）
# 格式：节点别名: {ip, hostname}
# ============================================================
nodes:
  realtime-dw1:
    ip: "192.168.10.10"
    hostname: "realtime-dw1"
  
  realtime-dw2:
    ip: "192.168.10.11"
    hostname: "realtime-dw2"
  
  realtime-dw3:
    ip: "192.168.10.12"
    hostname: "realtime-dw3"
  
  realtime-kafka1:
    ip: "192.168.10.13"
    hostname: "realtime-kafka1"
  
  realtime-kafka2:
    ip: "192.168.10.14"
    hostname: "realtime-kafka2"
  
  realtime-kafka3:
    ip: "192.168.10.15"
    hostname: "realtime-kafka3"
  
  realtime-es1:
    ip: "192.168.10.16"
    hostname: "realtime-es1"
  
  realtime-es2:
    ip: "192.168.10.17"
    hostname: "realtime-es2"
  
  realtime-es3:
    ip: "192.168.10.18"
    hostname: "realtime-es3"

# ============================================================
# 服务拓扑（服务部署位置，修改部署只需看这里）
# ============================================================
# 说明：
# - 使用节点别名列表指定部署位置
# - id_auto_derive: true 表示自动推导ID（myid/broker_id等）
# - ID推导规则：节点在列表中的索引 + 1
# ============================================================
serviceTop:
  # ==================== 基础服务 ====================
  zookeeper:
    nodes: [realtime-dw1, realtime-dw2, realtime-dw3]
    id_auto_derive: true
  
  kafka:
    nodes: [realtime-kafka1, realtime-kafka2, realtime-kafka3]
    id_auto_derive: true
  
  # ==================== Hadoop生态 ====================
  hadoop_namenode:
    nodes: [realtime-dw1, realtime-dw2]
    id_auto_derive: true
  
  hadoop_datanode:
    nodes: [realtime-dw1, realtime-dw2, realtime-dw3]
  
  spark_master:
    nodes: [realtime-dw1]
  
  spark_worker:
    nodes: [realtime-dw1, realtime-dw2, realtime-dw3]
  
  flink_jobmanager:
    nodes: [realtime-dw1]
  
  flink_taskmanager:
    nodes: [realtime-dw1, realtime-dw2, realtime-dw3]
  
  # ==================== 数据存储 ====================
  elasticsearch:
    nodes: [realtime-es1, realtime-es2, realtime-es3]
  
  # ==================== 调度系统 ====================
  dolphinscheduler_master:
    nodes: [realtime-dw1]
  
  dolphinscheduler_worker:
    nodes: [realtime-dw1, realtime-dw2, realtime-dw3]
  
  dolphinscheduler_api:
    nodes: [realtime-dw1]

# ============================================================
# 服务配置（服务参数，一般不需要修改）
# ============================================================
# 说明：
# - 这里的配置通常不需要修改，除非有特殊需求
# - vars: 该服务的配置参数
# ============================================================
serverConfig:
  # ==================== 基础服务 ====================
  zookeeper:
    version: "3.8.3"
    client_port: 2181
    server_port: 2888
    election_port: 3888
    tick_time: 2000
    init_limit: 10
    sync_limit: 5
  
  kafka:
    version: "3.5.1"
    scala_version: "2.13"
    broker_port: 9092
    num_partitions: 3
    default_replication_factor: 2
    log_retention_hours: 168
  
  # ==================== Hadoop生态 ====================
  hadoop_namenode:
    version: "3.3.6"
    namenode_port: 9820
    http_port: 9870
  
  hadoop_datanode:
    version: "3.3.6"
    data_port: 9866
    http_port: 9864
  
  spark_master:
    version: "3.5.0"
    hadoop_version: "3"
    master_port: 7077
    webui_port: 8080
  
  spark_worker:
    version: "3.5.0"
    webui_port: 8081
    cores: 4
    memory: "4g"
  
  flink_jobmanager:
    version: "1.18.0"
    scala_version: "2.12"
    rpc_port: 6123
    web_port: 8081
  
  flink_taskmanager:
    version: "1.18.0"
    task_slots: 4
    memory: "2g"
  
  # ==================== 数据存储 ====================
  elasticsearch:
    version: "8.11.1"
    cluster_name: "bigdata-cluster"
    http_port: 9200
    transport_port: 9300
  
  # ==================== 调度系统 ====================
  dolphinscheduler_master:
    version: "3.1.9"
    master_port: 5678
  
  dolphinscheduler_worker:
    version: "3.1.9"
    worker_port: 1234
  
  dolphinscheduler_api:
    version: "3.1.9"
    api_port: 12345

# ============================================================
# 节点特化配置（可选，用于覆盖默认值）
# ============================================================
# 说明：只有当某个节点需要特殊配置时才定义
# ============================================================
nodeOverrides:
  # 示例：realtime-dw3内存更大，可以提高Spark Worker配置
  # realtime-dw3:
  #   spark_worker:
  #     memory: "8g"
  #     cores: 8
