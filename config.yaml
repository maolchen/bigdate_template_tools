# ============================================================
# 全局配置
# ============================================================
global:
  # 基础目录
  install_base_dir: "/data/localization"
  data_base_dir: "/data"
  temp_dir: "/data/tmp_install_dir"
  software_dir: "/data/softwares"
  pkg_pro_dir: "/data/20251027-yuwq-cdtest"
  
  # JDK配置
  jdk_version: "1.8.0_65"
  jdk_path: "/data/jdk"
  java_home: "/data/jdk/"
  
  # 系统用户
  user: "bigdata"
  group: "bigdata"
  timezone: "Asia/Shanghai"

# ============================================================
# 节点池（支持一个IP对应多个节点别名）
# ============================================================
nodes:
  # ==================== Master节点 ====================
  dw-master1:
    ip: "192.168.10.10"
    hostname: "dw-master1"
  
  dw-master2:
    ip: "192.168.10.11"
    hostname: "dw-master2"
  
  dw-master3:
    ip: "192.168.10.12"
    hostname: "dw-master3"
  
  # ==================== Worker节点 ====================
  dw-worker1:
    ip: "192.168.10.13"
    hostname: "dw-worker1"
  
  dw-worker2:
    ip: "192.168.10.14"
    hostname: "dw-worker2"
  
  dw-worker3:
    ip: "192.168.10.15"
    hostname: "dw-worker3"
  
  # ==================== Kafka专用节点（复用worker机器）====================
  realtime-kafka1:
    ip: "192.168.10.13"
    hostname: "realtime-kafka1"
  
  realtime-kafka2:
    ip: "192.168.10.14"
    hostname: "realtime-kafka2"
  
  realtime-kafka3:
    ip: "192.168.10.15"
    hostname: "realtime-kafka3"
  
  # ==================== ES专用节点 ====================
  realtime-es1:
    ip: "192.168.10.16"
    hostname: "realtime-es1"
  
  realtime-es2:
    ip: "192.168.10.17"
    hostname: "realtime-es2"
  
  realtime-es3:
    ip: "192.168.10.18"
    hostname: "realtime-es3"

# ============================================================
# 服务拓扑（服务部署位置）
# ============================================================
serviceTop:
  # ==================== 第一步：服务器初始化（所有节点）====================
  server_init:
    nodes: ["*"]
  
  # ==================== 第二步：安装DNS服务（所有节点）====================
  dnsmasq:
    nodes: ["*"]
  
  # ==================== 第三步：安装NTP服务 ====================
  ntp_master:
    nodes: [dw-master1]
  
  ntp_slave:
    nodes: [dw-master2, dw-master3, dw-worker1, dw-worker2, dw-worker3,
            realtime-kafka1, realtime-kafka2, realtime-kafka3,
            realtime-es1, realtime-es2, realtime-es3]
  
  # ==================== 第四步：安装全局工具（所有节点）====================
  install_jdk:
    nodes: ["*"]
  
  # ==================== 第五步：安装Python3（所有节点）====================
  python3:
    nodes: ["*"]
  
  # ==================== 第六步：安装Scala（大数据节点）====================
  scala:
    nodes: [dw-master1, dw-master2, dw-master3,
            dw-worker1, dw-worker2, dw-worker3,
            realtime-kafka1, realtime-kafka2, realtime-kafka3]
  
  # ==================== 第六步：基础服务 ====================
  docker:
    nodes: [dw-master3, dw-worker1]
  
  # ==================== 第七步：MySQL数据库 ====================
  mysql:
    nodes: [dw-master3]
  
  zookeeper:
    nodes: [dw-master1, dw-master2, dw-master3]
    id_auto_derive: true
  
  kafka:
    nodes: [realtime-kafka1, realtime-kafka2, realtime-kafka3]
    id_auto_derive: true
  
  # ==================== 第四步：Hadoop生态 ====================
  hadoop_namenode:
    nodes: [dw-master1, dw-master2]
    id_auto_derive: true
  
  hadoop_datanode:
    nodes: [dw-worker1, dw-worker2, dw-worker3]
  
  spark_master:
    nodes: [dw-master1]
  
  spark_worker:
    nodes: [dw-worker1, dw-worker2, dw-worker3]
  
  flink_jobmanager:
    nodes: [dw-master1]
  
  flink_taskmanager:
    nodes: [dw-worker1, dw-worker2, dw-worker3]
  
  # ==================== 第五步：数据存储 ====================
  elasticsearch:
    nodes: [realtime-es1, realtime-es2, realtime-es3]
  
  # ==================== 第六步：调度系统 ====================
  dolphinscheduler_master:
    nodes: [dw-master1]
  
  dolphinscheduler_worker:
    nodes: [dw-worker1, dw-worker2, dw-worker3]
  
  dolphinscheduler_api:
    nodes: [dw-master1]

# ============================================================
# 服务配置（完全配置化，无硬编码）
# ============================================================
serverConfig:
  # ==================== 全局服务 ====================
  server_init:
    type: "global"
    description: "服务器初始化（所有节点）"
    vars:
      # 内核模块列表
      kernelModules:
        - ip_vs
        - ip_vs_rr
        - ip_vs_wrr
        - ip_vs_sh
        - nf_conntrack
        - br_netfilter
      # sysctl内核参数
      sysctlSettings:
        net.ipv4.ip_forward: 1
        net.core.somaxconn: 65536
        net.ipv4.tcp_max_syn_backlog: 8192
        vm.swappiness: 0
        vm.panic_on_oom: 0
        vm.max_map_count: 2000000
        vm.dirty_background_ratio: 5
        fs.file-max: 6553560
      # 文件描述符限制
      limitsSettings:
        '* soft nofile': '102400'
        '* hard nofile': '102400'
        '* soft nproc': '102400'
        '* hard nproc': '102400'
        '* soft memlock': 'unlimited'
        '* hard memlock': 'unlimited'
        'root soft nproc': 'unlimited'
        'root hard nproc': 'unlimited'
  
  install_jdk:
    type: "global"
    description: "安装JDK（所有节点）"
    vars:
      package_subdir: "realtime-new-doris/realtime/kafka"
      pkg_name: "jdk-8u202-linux-x64.tar.gz"
  
  # ==================== Python3 ====================
  python3:
    type: "global"
    description: "安装Python3（所有节点）"
    vars:
      version: "3.6.8"
      version_setuptools: "40.0.0"
      version_pip: "18.0"
      package_subdir: "realtime-new-doris/realtime/python3"
      pkg_name: "Python-3.6.8.tar.xz"
  
  # ==================== Scala ====================
  scala:
    description: "安装Scala（大数据节点）"
    vars:
      version: "2.11.6"
      install_dir: "/data/scala"
      package_subdir: "realtime-new-doris/realtime/kafka"
  
  # ==================== DNS服务 ====================
  dnsmasq:
    type: "global"
    description: "安装DNS服务（所有节点）"
    vars:
      conf_dir: "/etc/dnsmasq.d"
  
  # ==================== NTP服务 ====================
  ntp_master:
    description: "NTP主服务器"
    vars:
      stratum: 10
  
  ntp_slave:
    description: "NTP从服务器"
  
  # ==================== 基础服务 ====================
  docker:
    vars:
      version: "26.1.3"
      bin_path: "/usr/local/bin"
      package_subdir: "realtime-new-doris/realtime/web_all/docker"
  
  # ==================== MySQL数据库 ====================
  mysql:
    description: "MySQL数据库（Docker部署）"
    vars:
      # 容器配置
      container_name: "zanalytics_mysql_v33"
      mysql_image: "mysql:5.7.33"
      container_port: 3306
      
      # MySQL连接配置
      mysql_host: "realtime-db"
      mysql_port: 3306
      mysql_user: "web"
      mysql_password: "zanalytics"
      mysql_root_password: "zanalytics"
      
      # 数据库配置
      mysql_database: "sdkv"
      databases:
        - "sdkv"
        - "audit_log"
        - "cep"
      
      # 目录配置（相对路径，将与global.install_base_dir拼接）
      mysql_data_subdir: "mysql/data"
      mysql_config_subdir: "mysql"
      init_subdir: "mysql/init"
      
      # 安装包配置
      package_subdir: "realtime-new-doris/realtime/web_all/mysql"
      image_name: "mysql-5.7.33.tar"
      
      # SQL脚本目录
      sql_tools_subdir: "tools"
  
  zookeeper:
    id_field: "myid"
    id_format: "index+1"
    vars:
      version: "3.8.3"
      client_port: 2181
      server_port: 2888
      election_port: 3888
      tick_time: 2000
      init_limit: 10
      sync_limit: 5
  
  kafka:
    id_field: "broker_id"
    id_format: "index+1"
    vars:
      version: "3.5.1"
      scala_version: "2.13"
      broker_port: 9092
      num_partitions: 3
      default_replication_factor: 2
      log_retention_hours: 168
  
  # ==================== Hadoop生态 ====================
  hadoop_namenode:
    id_field: "namenode_id"
    id_format: "nn{index+1}"
    vars:
      version: "3.3.6"
      namenode_port: 9820
      http_port: 9870
  
  hadoop_datanode:
    vars:
      version: "3.3.6"
      data_port: 9866
      http_port: 9864
  
  spark_master:
    vars:
      version: "3.5.0"
      hadoop_version: "3"
      master_port: 7077
      webui_port: 8080
  
  spark_worker:
    vars:
      version: "3.5.0"
      webui_port: 8081
      cores: 4
      memory: "4g"
  
  flink_jobmanager:
    vars:
      version: "1.18.0"
      scala_version: "2.12"
      rpc_port: 6123
      web_port: 8081
  
  flink_taskmanager:
    vars:
      version: "1.18.0"
      task_slots: 4
      memory: "2g"
  
  # ==================== 数据存储 ====================
  elasticsearch:
    vars:
      version: "8.11.1"
      cluster_name: "bigdata-cluster"
      http_port: 9200
      transport_port: 9300
  
  # ==================== 调度系统 ====================
  dolphinscheduler_master:
    vars:
      version: "3.1.9"
      master_port: 5678
  
  dolphinscheduler_worker:
    vars:
      version: "3.1.9"
      worker_port: 1234
  
  dolphinscheduler_api:
    vars:
      version: "3.1.9"
      api_port: 12345

# ============================================================
# 节点特化配置（可选）
# ============================================================
nodeOverrides: {}
