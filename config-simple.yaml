# ============================================================
# 简化版配置示例 - 核心功能展示
# ============================================================

global:
  install_base_dir: "/data/localization"
  data_base_dir: "/data/bigdata"
  user: "bigdata"
  group: "bigdata"
  timezone: "Asia/Shanghai"

# ============================================================
# 节点池（支持一个IP对应多个节点别名）
# ============================================================
nodes:
  # Master节点
  master1:
    ip: "192.168.1.10"
    hostname: "master1"
  
  # Worker节点
  worker1:
    ip: "192.168.1.11"
    hostname: "worker1"
  
  # ⭐ 节点复用示例：kafka1 和 worker2 共用一台机器
  worker2:
    ip: "192.168.1.12"
    hostname: "worker2"
  
  kafka1:
    ip: "192.168.1.12"  # 与worker2共用IP
    hostname: "kafka1"

# ============================================================
# 服务拓扑（支持全局服务）
# ============================================================
serviceTop:
  # ⭐ 全局服务：所有节点执行
  server_init:
    nodes: ["*"]  # 或 ["all"]
  
  install_jdk:
    nodes: ["*"]
  
  # 中间件服务
  zookeeper:
    nodes: [master1, worker1, worker2]
    id_auto_derive: true
  
  kafka:
    nodes: [kafka1]  # 独立节点（复用worker2的机器）
    id_auto_derive: true

# ============================================================
# 服务配置（ID格式配置化）
# ============================================================
serverConfig:
  # 全局服务
  server_init:
    type: "global"
    description: "服务器初始化"
  
  install_jdk:
    type: "global"
    description: "安装JDK"
  
  # 中间件
  zookeeper:
    id_field: "myid"
    id_format: "index+1"  # 1, 2, 3
    vars:
      version: "3.8.3"
      client_port: 2181
  
  kafka:
    id_field: "broker_id"
    id_format: "index+1"  # 1
    vars:
      version: "3.5.1"
      broker_port: 9092
